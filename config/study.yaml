# Study configuration: every setting and every deferred decision lives here.
# Decision IDs refer to section 0.3 of plans/PLAN2.md and plans/PLAN4.md (docs/open_questions.md). Code tags each use with DECISION(<ID>).

universe:
  size: 100                       # DECISION(B4): 100 (ARCTIC startup allocation, 1,000 GPU-hours, 2026-11-16)
  source: sp500                   # DECISION(B2): sector balanced, drawn from the S&P 500
  sectors: 11
  min_history_days: 300
  dollar_volume_window_days: 60
  extra_tickers: []
  universe_file: config/universe.csv
  etf_proxies: [SPY, IWM, IWD, IWF, QUAL]

timing:
  timezone: America/New_York
  cutoff_time_et: "16:00"
  lock_deadline_time_et: "09:00"  # Monday, 30 minutes before the open
  pilot_week: null                # ISO week id of the pilot, excluded from results
  live_start_week: null           # DECISION(A2): first live week is the week after the pilot passes
  live_end_date: null             # DECISION(A3): set by Carter before the freeze

data:
  price_provider: alpaca          # alpaca | yfinance | synthetic
  news_provider: alpaca           # alpaca | synthetic
  alpaca_feed: sip                # DECISION(G16): consolidated feed; if the free plan refuses it set price_provider: yfinance
  reference_provider: yfinance    # yfinance | synthetic
  rate_provider: fred             # fred | synthetic
  earnings_provider: finnhub      # finnhub | synthetic
  price_history_days: 300
  first_snapshot_news_days: 7
  news_token_budget_per_stock: 1500
  news_tokenizer: null            # null uses the len/4 estimate
  rate_limits:
    alpaca_per_minute: 200
    finnhub_per_minute: 60
    fred_per_minute: 120
    yfinance_per_minute: 60
  retries:
    attempts: 3
    backoff_seconds: 2.0
  fixture_dir: tests/fixtures/providers
  checks:
    missing_days: forward_fill
    nonpositive_price: skip_stock
    duplicate_rows: skip_stock
    stale_price: skip_stock
    no_news: forward_fill         # the stock stays; the no-news sentence is used
    news_after_cutoff: forward_fill  # rows are dropped, the stock stays
    short_history: skip_stock
    stopped_trading: skip_stock   # delisted or suspended: dropped without replacement
    unexplained_split: skip_stock # U1: raw jump absent from adjusted, no split action; skip this week only
    large_move_flag: 0.10         # U1: 5-day adjusted move at or beyond this flags the stock, keeps it
    crash_removal: -0.40          # U1: single-day or 5-day adjusted return at or below this removes the stock for good
    stale_days: 5

synthetic:
  seed: 20260101
  n_tickers: 120
  history_days: 400
  future_weeks: 40
  first_week: "2026-W02"         # first weekly cutoff in the synthetic world
  world_dir: data/synthetic

baseline:
  forecaster: stub                # stub | kronos
  on_kronos_failure: momentum_only  # DECISION(K3): hold | momentum_only
  momentum_lookbacks:
    long: 252
    skip: 21
    medium: 63
    short: 21
  kronos:
    repo_commit: UNPINNED         # Carter pins the vendor/kronos commit in PLAN2 phase 15 C
    model_id: NeoQuasar/Kronos-base
    tokenizer_id: NeoQuasar/Kronos-Tokenizer-base
    context_candles: 252
    horizon: 5
    n_samples: 20
    batch_size: 100               # DECISION(K2): stocks per chunk; frozen with the config (chunking changes the sampled paths)
    device: cuda                  # cuda | cpu
    temperature: 1.0
    top_p: 0.9
    seed: 7
    input_prices: adjusted        # DECISION(E4)
  stub_seed: 11

risk:
  cov_lookback_days: 252
  delta: 2.5
  weekly_scale: 5
  min_eigenvalue: 1.0e-10
  market_cap_weights: study_only  # DECISION(E5)

llm:
  cost_goal_usd: 50.0             # DECISION(D3)
  cost_warn_usd: 50.0
  temperature: 0.0                # DECISION(D4)
  no_news_sentence: "No relevant news is available for this week."   # DECISION(C2)
  prompt_fields: [ticker, name, sector, news]                       # DECISION(C1)
  skills_token_cap: 6000          # DECISION(C4)
  skills_length_tolerance: 0.05   # DECISION(P1)
  rationale_token_cap: 150        # DECISION(C7)
  placebo_length_tolerance: 0.02
  invalid_rate_threshold: 0.15    # DECISION(N1)
  retry_invalid_once: true
  batch_retry_count: 1
  parallel_models: true           # PLAN3 phase 3: J4 runs the open-weight models side by side
  network_outage_tolerance_minutes: 60  # pause and retry on connection errors (VPN drop) before counting failures
  api_poll_seconds: 300
  model_ids: []
  prompt_ids: []
  settings_default:
    temperature: 0.0
    seed: 1234
    max_output_tokens: 300
    reasoning: none
    send_seed: true                 # passed through by the gateway (ARCTIC, 2026-11-12); outputs not guaranteed identical
    json_mode: true                 # UNVERIFIED: confirm ARCTIC accepts response_format
  settings: {}
  concurrency:
    gemma-4-31b: 4
    minimax-m2.7: 4
    stub-ow-a: 1
    stub-ow-b: 1
  gateway:
    base_url: https://litellm.rs.gsu.edu/v1  # ARCTIC LiteLLM gateway; GSU network or VPN required
    features_frozen: false         # DECISION(G15): set true after the pilot; then a rejected seed or response_format is a failure

views:
  tau: 0.05
  ic_mode: fixed                  # DECISION(A8): fixed scale until enough scored weeks exist
  fixed_ic: 0.02                  # DECISION(A8)
  ic_history_start: live_start_week  # DECISION(A7): pilot and dry-run weeks never feed views or results
  ic_window_weeks: 8
  ic_floor: 0.0
  cold_start_weeks: 5             # DECISION(A6)
  cold_start_ic: 0.02             # DECISION(A6)
  ic_min_weeks: 3
  kronos_spread_clip: [0.25, 4.0]  # DECISION(K1)
  width_conf_clip: [0.1, 1.0]     # DECISION(E1)
  ic_signal_for_llm: llm_resid    # DECISION(E2)

optimizer:
  max_weight: 0.05                 # DECISION(G1)
  min_stocks: 20
  solvers: [OSQP, CLARABEL]

strategies:
  enabled: [mvo, cvar, robust, resampled, topk]  # DECISION(S1)
  controls: [HRP, EW]               # DECISION(S2)
  cvar:
    n_scenarios: 10000             # DECISION(S3)
    beta: 0.95                     # DECISION(S3)
    lam: 0.1                       # DECISION(S4): set by scripts/calibrate_view_sensitivity.py (S8), 2026-11-17
    seed: 7
    solvers: [CLARABEL, HIGHS]
  robust:
    kappa: 1.0                    # DECISION(S5)
    solvers: [CLARABEL]
  resampled:
    n_draws: 200                   # DECISION(S6)
    seed: 7
    max_failed_share: 0.10
    draw_scale: 0.025              # DECISION(S8): set by scripts/calibrate_view_sensitivity.py, 2026-11-17
  topk:
    k: 20                          # DECISION(S7)
  hrp:
    linkage: single

simulator:
  initial_value: 100000
  cost_bps: 10
  stop_loss: -0.08
  take_profit: 0.15
  no_price_liquidation_days: 5    # DECISION(U2): sell a position with no price this many ledger days at its last close

pipeline:
  jobs: [J1, J2, J3, J4, J5, J6, J7, J8, J9]
  stop_on_failure: true
  lock_margin_minutes: 30         # J6 fails a run not finished this long before the Monday lock

eval:
  tie_band: 0.001                 # DECISION(G12): 10 bps
  tie_band_sensitivity: [0.0, 0.0005, 0.001, 0.005, 0.01]
  bootstrap_samples: 2000
  bootstrap_block_mean: null      # null means T^(1/3)
  signflip_exact_max_t: 24        # exact sign-flip enumeration up to this T, Monte Carlo above
  permutation_samples: 10000
  significance: 0.05
  seed: 2026
  combined_signal: bl_tilt        # DECISION(E3)
  factor_frequency: daily         # DECISION(G5)
  factor_source: french           # DECISION(G11): french | etf_proxy
  fama_french_file: null          # Kenneth French daily FF5 CSV
  momentum_file: null             # Kenneth French daily momentum CSV
  risk_free: fred
  cer_gamma: [2, 5]
  report_active_weeks: true       # DECISION(G8)
  preregistration_file: config/preregistration.yaml
  multiple_testing:               # DECISION(G7)
    primary_procedure: holm
    secondary_procedure: fdr_bh
    exploratory: [H4]
  h4_splits: [market_direction, volatility, earnings_week]   # DECISION(G4)
  min_group_size: 10
  h3b:                            # DECISION(G3b)
    split: median
    min_group_size: 10

arctic:                           # DECISION(N7): usage tracking; the run never stops on GPU-hours
  gpu_hours_allocated: 1000       # startup allocation, 2026-11-16
  gpu_seconds_per_request:        # estimates until the timing run measures them
    gemma-4-31b: 40
    minimax-m2.7: 90
  litellm_budget_usd: 10          # gateway dollar budget (Andalib, 2026-11-17); checked before J4
  warn_share: 0.75
  alert_share: 0.90

backup:
  keep_zips: true
  master_tables: [llm_scores, trades, daily_values, weekly_ic, fallback_log, cost_log]

decisions:
  - id: D1
    value: >-
      ARCTIC LiteLLM gateway: Gemma 4 31B and MiniMax M2.7 only (no deployment requests);
      API: Claude Haiku 5.5 and GPT-6 Luna; Kronos and everything else on Carter's desktop
    status: confirmed
  - id: D2
    value: "gateway outage: that model's week is marked failed and left out of its statistics; its portfolios trade Q0; no fallback server"
    status: confirmed
  - id: D3
    value: 50.0
    status: provisional
  - id: D4
    value: "0.0 for every model with seed sent; outputs not guaranteed identical (ARCTIC, 2026-11-12); G20 measures it"
    status: confirmed
  - id: B1
    value: "bare, placebo, and 4 similar-length specialized skills files (skills_5 off); one placebo matched to mean skills length"
    status: confirmed
  - id: B2
    value: sp500_sector_balanced
    status: confirmed
  - id: B4
    value: 100  # ARCTIC startup allocation, 1,000 GPU-hours (2026-11-16)
    status: confirmed
  - id: C3
    value: "JSON low, likely, high integers in [-5, 5], rationale; low <= likely <= high; no separate certainty field"
    status: confirmed
  - id: A2
    value: week_after_pilot
    status: confirmed
  - id: A3
    value: timing.live_end_date
    status: confirmed
  - id: A4
    value: closed_friday_uses_prior_trading_day
    status: confirmed
  - id: A6
    value: 0.02
    status: confirmed
  - id: C1
    value: [ticker, name, sector, news]
    status: confirmed
  - id: C2
    value: "No relevant news is available for this week."
    status: confirmed
  - id: C4
    value: 6000
    status: provisional
  - id: C7
    value: 150
    status: provisional
  - id: E1
    value: "width = high - low; c = clip(1 - width/10, 0.1, 1); Omega_L,ii = tau Sigma_ii / c"
    status: confirmed
  - id: E2
    value: residualized_likely_score
    status: confirmed
  - id: E6
    value: "Kronos 20-path spread mapping K1"
    status: confirmed
  - id: K1
    value: "k_sd_i=sd of 20 five-day return paths; r_i=clip(k_sd_i/median(k_sd),0.25,4); Omega_b,ii=tau Sigma_ii r_i"
    status: confirmed
  - id: S1
    value: "MVO, Mean-CVaR, Robust MVO, Resampled MVO, Top-K; each has its own Q0"
    status: confirmed
  - id: S2
    value: "HRP and equal weight controls; no LLM view or Q0"
    status: confirmed
  - id: S3
    value: "10,000 Monte Carlo scenarios from the BL posterior; beta=0.95"
    status: confirmed
  - id: S4
    value: "0.1, set by the S8 calibration (2026-11-17); Carter confirms before the freeze"
    status: provisional
  - id: E7
    value: "q_L = mu_Q0 + IC_L sigma z_L (LLM view centered on the Q0 posterior mean)"
    status: confirmed
  - id: G18
    value: "confidence-only counterfactual: same Omega_L, z_L = 0; trace ratio recorded"
    status: confirmed
  - id: G19
    value: "confidence-only control portfolios for Robust and Resampled MVO"
    status: confirmed
  - id: S8
    value: "Mean-CVaR lam 0.1 and Resampled draw_scale 0.025 by the fixed calibration rule (2026-11-17)"
    status: provisional
  - id: S5
    value: "kappa=1.0, ellipsoid from BL posterior covariance of the mean"
    status: confirmed
  - id: S6
    value: 200
    status: confirmed
  - id: S7
    value: "K=20, equal weights"
    status: confirmed
  - id: G1
    value: "5% cap, no shorts, 10 bps cost, -8% stop-loss, +15% take-profit, weekly rebalance"
    status: confirmed
  - id: E3
    value: bl_tilt
    status: confirmed
  - id: E4
    value: adjusted
    status: confirmed
  - id: E5
    value: study_only
    status: confirmed
  - id: G3
    value: >-
      each skills file vs bare and placebo per model on IC and active return, plus a pooled regression
      with model fixed effects; H3b range-width test
    status: confirmed
  - id: G3b
    value: >-
      per source-week median width split (rank IC narrow minus wide), a score-by-confidence Fama-
      MacBeth interaction and a width vs absolute rank error correlation
    status: confirmed
  - id: P1
    value: "each skills file within 5% of mean skills length; placebo within 2%"
    status: confirmed
  - id: G4
    value: >-
      exploratory: strategy ranking by mean active return vs own Q0, strategy-vs-strategy differences,
      market, volatility and earnings splits
    status: confirmed
  - id: G5
    value: daily
    status: confirmed
  - id: G7
    value: >-
      Holm on the four pooled main comparisons in config/preregistration.yaml; Benjamini-Hochberg on
      every other comparison; H4 exploratory
    status: confirmed
  - id: N2
    value: "Carter runs python scripts/run_weekend.py by hand on the desktop, Friday night (Saturday morning as backup); no scheduler"
    status: confirmed
  - id: N1
    value: "invalid_rate>0.15 or local not done by lock or batch not ready by lock"
    status: confirmed
  - id: N3
    value: csv_weekly_download
    status: confirmed
  - id: L1
    value: "everything except LLM calls on Carter's desktop in WSL2; Kronos on the local RTX 3050; ARCTIC is gateway GPU hours only"
    status: confirmed
  - id: K2
    value: "Kronos in chunks of baseline.kronos.batch_size (100), one seed per (sample, chunk); batch_size frozen"
    status: confirmed
  - id: K3
    value: "on Kronos failure the baseline is momentum only for every portfolio that week, flagged"
    status: confirmed
  - id: G8
    value: "H2 reported intention-to-treat (all clean weeks) and active-view weeks, with each source's active-week share"
    status: confirmed
  - id: G9
    value: "residual IC: weekly Fama-MacBeth on the controls in config/preregistration.yaml"
    status: confirmed
  - id: G10
    value: "portfolio metrics net of the T-bill rate: Sharpe, Sortino, max drawdown, CVaR, IR, tracking error, PSR, CER, break-even cost"
    status: confirmed
  - id: G11
    value: "Kenneth French daily FF5 plus momentum on daily active and excess returns; ETF proxies for live monitoring only"
    status: confirmed
  - id: G12
    value: >-
      Student-t with T-1 df; Newey-West lags floor(4 (T/100)^(2/9)); stationary block bootstrap
      percentile-t; exact sign-flip when T <= 24; Ledoit-Wolf Sharpe test; tie band 0.001
    status: confirmed
  - id: G13
    value: >-
      view sensitivity as expected tracking error vs Q0 net of the confidence-only part; insensitive
      below view_sensitivity_min_tracking_error
    status: confirmed
  - id: G14
    value: "H2 signal test compares the steered tilt IC with Q0's tilt IC; every IC gap on the same stocks each week"
    status: confirmed
  - id: G15
    value: "per-model max_output_tokens and timeout (Gemma 300/180 s, MiniMax 2000/600 s); reasoning saved; features frozen after the pilot"
    status: confirmed
  - id: G16
    value: "Alpaca feed sip by default; yfinance fallback"
    status: confirmed
  - id: G17
    value: "ARCTIC sizing: 300 to 8,000 input tokens; 300 (Gemma) and 2,000 (MiniMax) output; 40 and 90 GPU-seconds per request (estimates)"
    status: confirmed
  - id: G20
    value: "pilot repeat check: first 50 stocks re-rated under every prompt type per gateway model, cache bypassed"
    status: confirmed
  - id: G21
    value: "weekly model checks and 10 canaries before J4; model_change flags never stop the run"
    status: confirmed
  - id: G22
    value: "every metric for every source, portfolio, model, prompt and strategy in results/eval/all_metrics.csv"
    status: confirmed
  - id: G1b
    value: "a stop merged into the rebalance resets the average cost to the rebalance open"
    status: confirmed
  - id: N4
    value: "study log one row per week; weekly returns Monday open to Monday open; keep-awake, outage tolerance, checkpoints, progress"
    status: confirmed
  - id: N5
    value: "a failed gateway request is an invalid provider_error record; J4 fails while a request has no record"
    status: confirmed
  - id: N6
    value: "run_id, event timeline, tracebacks, captured warnings, fallbacks.csv, fsync, disk check, run_summary.md, audit"
    status: confirmed
  - id: N7
    value: "GPU-hours vs 1,000 and gateway dollars vs arctic.litellm_budget_usd; warn 75%, alert 90%; dollar check before J4"
    status: confirmed
  - id: C8
    value: "prompt name and sector from the frozen universe file; yfinance market cap only, last good value reused"
    status: confirmed
  - id: A7
    value: "views.ic_history_start live_start_week: pre-live weeks never count; every portfolio starts from cash at the first live week"
    status: confirmed
  - id: A8
    value: "views.ic_mode fixed, IC_b = IC_L = 0.02 every week"
    status: confirmed
  - id: A9
    value: "Friday 16:00 ET news cutoff, unchanged"
    status: confirmed
  - id: U1
    value: >-
      5-day adjusted move beyond 10% flagged and kept; -40% single day or 5-day removes the stock for
      good; unexplained split skips one week
    status: confirmed
  - id: U2
    value: "a holding with no price for 5 trading days is sold at its last close"
    status: confirmed
  - id: D5
    value: "every enabled API model needs a dated snapshot_id for a live run"
    status: confirmed
