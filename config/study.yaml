# Study configuration: every setting and every deferred decision lives here.
# Decision IDs refer to section 0.3 of PLAN2.md. Code tags each use with DECISION(<ID>).

universe:
  size: 100                       # DECISION(B4): 100 to 300, set after the ARCTIC allocation
  source: sp500                   # DECISION(B2): sector balanced, drawn from the S&P 500
  sectors: 11
  min_history_days: 300
  dollar_volume_window_days: 60
  extra_tickers: []
  universe_file: config/universe.csv
  etf_proxies: [SPY, IWM, IWD, IWF, QUAL]

timing:
  timezone: America/New_York
  cutoff_time_et: "16:00"
  lock_deadline_time_et: "09:00"  # Monday, 30 minutes before the open
  pilot_week: null                # ISO week id of the pilot, excluded from results
  live_start_week: null           # DECISION(A2): first live week is the week after the pilot passes
  live_end_date: null             # DECISION(A3): set by the researcher, no later than the April deadline

data:
  price_provider: alpaca          # alpaca | yfinance | synthetic
  news_provider: alpaca           # alpaca | synthetic
  reference_provider: yfinance    # yfinance | synthetic
  rate_provider: fred             # fred | synthetic
  earnings_provider: finnhub      # finnhub | synthetic
  price_history_days: 300
  first_snapshot_news_days: 7
  news_token_budget_per_stock: 1500
  news_tokenizer: null            # null uses the len/4 estimate
  rate_limits:
    alpaca_per_minute: 200
    finnhub_per_minute: 60
    fred_per_minute: 120
    yfinance_per_minute: 60
  retries:
    attempts: 3
    backoff_seconds: 2.0
  fixture_dir: tests/fixtures/providers
  checks:
    missing_days: forward_fill
    nonpositive_price: skip_stock
    extreme_move: skip_stock
    duplicate_rows: skip_stock
    stale_price: skip_stock
    no_news: forward_fill         # the stock stays; the no-news sentence is used
    news_after_cutoff: forward_fill  # rows are dropped, the stock stays
    short_history: skip_stock
    stopped_trading: skip_stock   # delisted or suspended: dropped without replacement
    extreme_move_threshold: 0.40
    stale_days: 5

synthetic:
  seed: 20260101
  n_tickers: 120
  history_days: 400
  future_weeks: 40
  first_week: "2026-W02"         # first weekly cutoff in the synthetic world
  world_dir: data/synthetic

baseline:
  forecaster: stub                # stub | kronos
  momentum_lookbacks:
    long: 252
    skip: 21
    medium: 63
    short: 21
  kronos:
    repo_commit: UNPINNED         # researcher pins the vendor/kronos commit in Phase 17
    model_id: NeoQuasar/Kronos-base
    tokenizer_id: NeoQuasar/Kronos-Tokenizer-base
    context_candles: 252
    horizon: 5
    n_samples: 20
    temperature: 1.0
    top_p: 0.9
    seed: 7
    input_prices: adjusted        # DECISION(E4)
  stub_seed: 11

risk:
  cov_lookback_days: 252
  delta: 2.5
  weekly_scale: 5
  min_eigenvalue: 1.0e-10
  market_cap_weights: study_only  # DECISION(E5)

llm:
  cost_goal_usd: 50.0             # DECISION(D3)
  cost_warn_usd: 50.0
  temperature: 0.0                # DECISION(D4)
  no_news_sentence: "No relevant news is available for this week."   # DECISION(C2)
  prompt_fields: [ticker, name, sector, news]                       # DECISION(C1)
  skills_token_cap: 6000          # DECISION(C4)
  skills_length_tolerance: 0.05   # DECISION(P1)
  rationale_token_cap: 150        # DECISION(C7)
  placebo_length_tolerance: 0.02
  invalid_rate_threshold: 0.15    # DECISION(N1)
  retry_invalid_once: true
  batch_retry_count: 1
  api_poll_seconds: 300
  model_ids: []
  prompt_ids: []
  settings_default:
    temperature: 0.0
    seed: 1234
    max_output_tokens: 300
    reasoning: none
    send_seed: true                 # UNVERIFIED: confirm ARCTIC accepts seed
    json_mode: true                 # UNVERIFIED: confirm ARCTIC accepts response_format
  settings:
    minimax-m2.7:
      max_output_tokens: 2048
  concurrency:
    gemma-4-31b: 4
    minimax-m2.7: 4
    stub-ow-a: 1
    stub-ow-b: 1
  gateway:
    base_url: ""                    # UNVERIFIED: set the ARCTIC LiteLLM base URL when provisioned
    fallback_endpoint_file: data/runtime/fallback_endpoint.json

views:
  tau: 0.05
  ic_window_weeks: 8
  ic_floor: 0.0
  cold_start_weeks: 5             # DECISION(A6)
  cold_start_ic: 0.02             # DECISION(A6)
  ic_min_weeks: 3
  kronos_spread_clip: [0.25, 4.0]  # DECISION(K1)
  width_conf_clip: [0.1, 1.0]     # DECISION(E1)
  ic_signal_for_llm: llm_resid    # DECISION(E2)

optimizer:
  max_weight: 0.05                 # DECISION(G1)
  min_stocks: 20
  solvers: [OSQP, CLARABEL]

strategies:
  enabled: [mvo, cvar, robust, resampled, topk]  # DECISION(S1)
  controls: [HRP, EW]               # DECISION(S2)
  cvar:
    n_scenarios: 10000             # DECISION(S3)
    beta: 0.95                     # DECISION(S3)
    lam: 1.0                       # DECISION(S4)
    seed: 7
    solvers: [CLARABEL, HIGHS]
  robust:
    kappa: 1.0                    # DECISION(S5)
    solvers: [CLARABEL]
  resampled:
    n_draws: 200                   # DECISION(S6)
    seed: 7
    max_failed_share: 0.10
  topk:
    k: 20                          # DECISION(S7)
  hrp:
    linkage: single

simulator:
  initial_value: 100000
  cost_bps: 10
  stop_loss: -0.08
  take_profit: 0.15

pipeline:
  jobs: [J1, J2, J3, J4, J5, J6, J7, J8, J9]
  stop_on_failure: true
  lock_margin_minutes: 30         # J6 fails a run not finished this long before the Monday lock

eval:
  tie_band: 0.01
  bootstrap_samples: 2000
  permutation_samples: 10000
  significance: 0.05
  seed: 2026
  combined_signal: bl_tilt        # DECISION(E3)
  factor_frequency: daily         # DECISION(G5)
  fama_french_file: null
  holm_families:
    H1_ic_gap: all_portfolios
    H2_ic_gap: all_portfolios
    H2_portfolio_vs_q0: all_portfolios
    H3_skills_vs_controls: per_model_skills_vs_bare_and_placebo
    H5_shuffle: all_portfolios_plus_q0
  h4_splits: [market_direction, volatility, earnings_week]   # DECISION(G4)
  min_group_size: 10
  shuffle:
    n_shuffles: 500               # DECISION(G6)
    seed: 99
    processes: 1

backup:
  keep_zips: true
  master_tables: [llm_scores, trades, daily_values, weekly_ic, fallback_log, cost_log]

decisions:
  - id: D1
    value: >-
      ARCTIC LiteLLM gateway: Gemma 4 31B, MiniMax M2.7; requested deployments: Gemma 4 E4B,
      Phi-4 Mini 3.8B, Llama 3.2 3B; API: one or two of Claude Haiku 5.5, GPT-6 Luna. No local GPU.
    status: confirmed
  - id: D2
    value: "gateway outage uses Carter's Slurm GPU jobs; otherwise that model's week is missed and excluded from its tests"
    status: confirmed
  - id: D3
    value: 50.0
    status: provisional
  - id: D4
    value: 0.0
    status: confirmed
  - id: B1
    value: "bare, placebo, and 4 to 5 similar-length specialized skills files; one placebo matched to mean skills length"
    status: confirmed
  - id: B2
    value: sp500_sector_balanced
    status: confirmed
  - id: B4
    value: "100 to 300, set after ARCTIC allocation is known"
    status: confirmed
  - id: C3
    value: "JSON low, likely, high integers in [-5, 5], rationale; low <= likely <= high; no confidence field"
    status: confirmed
  - id: A2
    value: week_after_pilot
    status: confirmed
  - id: A3
    value: timing.live_end_date
    status: confirmed
  - id: A4
    value: closed_friday_uses_prior_trading_day
    status: confirmed
  - id: A6
    value: 0.02
    status: confirmed
  - id: C1
    value: [ticker, name, sector, news]
    status: confirmed
  - id: C2
    value: "No relevant news is available for this week."
    status: confirmed
  - id: C4
    value: 6000
    status: provisional
  - id: C7
    value: 150
    status: provisional
  - id: E1
    value: "width = high - low; c = clip(1 - width/10, 0.1, 1); Omega_L,ii = tau Sigma_ii / c"
    status: confirmed
  - id: E2
    value: residualized_likely_score
    status: confirmed
  - id: E6
    value: "Kronos 20-path spread mapping K1"
    status: confirmed
  - id: K1
    value: "k_sd_i=sd of 20 five-day return paths; r_i=clip(k_sd_i/median(k_sd),0.25,4); Omega_b,ii=tau Sigma_ii r_i"
    status: confirmed
  - id: S1
    value: "MVO, Mean-CVaR, Robust MVO, Resampled MVO, Top-K; each has its own Q0"
    status: confirmed
  - id: S2
    value: "HRP and equal weight controls; no LLM view, Q0, or shuffle test"
    status: confirmed
  - id: S3
    value: "10,000 Monte Carlo scenarios from the BL posterior; beta=0.95"
    status: confirmed
  - id: S4
    value: 1.0
    status: confirmed
  - id: S5
    value: "kappa=1.0, ellipsoid from BL posterior covariance of the mean"
    status: confirmed
  - id: S6
    value: 200
    status: confirmed
  - id: S7
    value: "K=20, equal weights"
    status: confirmed
  - id: G1
    value: "5% cap, no shorts, 10 bps cost, -8% stop-loss, +15% take-profit, weekly rebalance"
    status: confirmed
  - id: E3
    value: bl_tilt
    status: confirmed
  - id: E4
    value: adjusted
    status: confirmed
  - id: E5
    value: study_only
    status: confirmed
  - id: G3
    value: "each skills file vs bare and placebo per model, plus H3b range-width test"
    status: confirmed
  - id: G3b
    value: "per source-week median width split; rank IC narrow minus wide"
    status: confirmed
  - id: P1
    value: "each skills file within 5% of mean skills length; placebo within 2%"
    status: confirmed
  - id: G4
    value: "strategy ranking by mean weekly gap vs own Q0, plus v1 market, volatility, earnings splits"
    status: confirmed
  - id: G5
    value: daily
    status: confirmed
  - id: G6
    value: 500
    status: confirmed
  - id: G7
    value: "IC tests as v1; portfolio return and shuffle tests one family per strategy"
    status: confirmed
  - id: N2
    value: "Carter runs one submit script by hand on ARCTIC; no scheduler"
    status: confirmed
  - id: N1
    value: "invalid_rate>0.15 or local not done by lock or batch not ready by lock"
    status: confirmed
  - id: N3
    value: csv_weekly_download
    status: confirmed
