llm:
  parallel_models: false          # sequential in tests so two runs give identical digests
  model_ids: [stub-ow-a, stub-ow-b]
  prompt_ids: [bare, placebo, skills_1, skills_2]

views:
  ic_mode: trailing               # the trailing-IC tests keep their meaning under A8

synthetic:
  n_tickers: 120

strategies:
  enabled: [mvo, cvar, robust, resampled, topk]
  controls: [HRP, EW]
  cvar:
    n_scenarios: 2000
  resampled:
    n_draws: 20

eval:
  preregistration_file: config/preregistration_test.yaml
